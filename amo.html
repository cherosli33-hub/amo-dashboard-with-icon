<style>
  :root{
    --bg:#F7F5F0; --panel:#FFFFFF; --border:#E4E0D5; --chip:#F1EEE5;
    --text:#1C2420; --text2:#2B332F; --text3:#3A4440; --muted:#6B7268; --muted2:#5C6560; --faint:#8A8478;
    --accent:#1C9665; --accent-soft:rgba(28,150,101,0.06); --accent-grad1:#6FE3A8; --accent-grad2:#4FC890; --accent-grad3:#2F8F66;
    --pagi:#F2A93B; --pagi-glow:rgba(242,169,59,0.18);
    --petang:#E2622E; --petang-glow:rgba(226,98,46,0.18);
    --malam:#5B7FE0; --malam-glow:rgba(91,127,224,0.18);
    --warn-bg:#FBF0E8; --warn-border:#E8C9A8; --warn-text:#8A4A1C;
    color-scheme: light only;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg) !important; color:var(--text); font-family:'IBM Plex Sans',sans-serif; -webkit-tap-highlight-color:transparent; overscroll-behavior:none;}
  body{
    min-height:100vh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    background-image:
      linear-gradient(rgba(0,0,0,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.018) 1px, transparent 1px);
    background-size:28px 28px;
  }
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  .wrap{max-width:720px; margin:0 auto; padding:28px 20px 18px;}
  .hidden{display:none !important;}

  /* Header */
  .header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:28px;}
  .header .date{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.2em; color:var(--muted); text-transform:uppercase; margin-bottom:6px;}
  .header h1{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; line-height:1.15; letter-spacing:-0.01em;}
  .header .icon{width:44px; height:44px; border-radius:12px; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .header .icon img{width:100%; height:100%; object-fit:contain; border-radius:11px; display:block;}

  /* Sync warning */
  .sync-warn{width:100%; display:flex; align-items:center; gap:10px; background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-text); font-size:14px; padding:12px 16px; border-radius:12px; margin-bottom:24px; text-align:left;}

  /* Loading */
  .loading-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:12px;}
  .spinner{width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen span{font-size:14px; color:var(--muted);}

  /* Ring card */
  .ring-card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:28px;}
  .ring-row{display:flex; align-items:center; gap:20px;}
  .ring-box{position:relative; width:168px; height:168px; flex-shrink:0;}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-center .num{font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600;}
  .ring-center .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}
  .ring-legend{flex:1; display:flex; flex-direction:column; gap:10px;}
  .ring-legend-row{display:flex; align-items:center; justify-content:space-between;}
  .ring-legend-left{display:flex; align-items:center; gap:8px;}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .ring-legend-row .label{font-size:14px; color:var(--text3);}
  .ring-legend-row .now-tag{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted);}
  .ring-legend-row .count{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--text);}

  /* Section */
  .section{margin-bottom:28px;}
  .section h2{font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted2); margin-bottom:14px;}
  .empty-note{background:var(--panel); border:1px dashed var(--border); border-radius:12px; padding:20px; text-align:center; font-size:14px; color:var(--faint);}

  /* Bars */
  .bar-row{margin-bottom:14px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .bar-top .name{font-size:14px; font-weight:500; color:var(--text2);}
  .bar-top .count{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--muted);}
  .bar-track{height:6px; background:var(--panel); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; transition:width 0.6s ease-out;}

  /* Trend chart */
  .trend-chart{display:flex; align-items:flex-end; gap:10px; height:128px; padding:8px 4px 0;}
  .trend-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end;}
  .trend-count{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); height:12px;}
  .trend-bar{width:100%; border-radius:5px 5px 0 0; transition:height 0.6s ease-out; min-height:4px;}
  .trend-label{font-size:11px; color:var(--muted);}
  .trend-label.today{color:var(--accent); font-weight:600;}

  /* Case list */
  .case-list{display:flex; flex-direction:column; gap:10px;}
  .case-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px;}
  .case-card-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .case-meta{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .case-time{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);}
  .shift-pill{font-size:11px; padding:2px 8px; border-radius:99px; font-weight:500;}
  .case-procs{display:flex; flex-wrap:wrap; gap:6px;}
  .proc-chip{font-size:12px; background:var(--chip); color:var(--text3); padding:4px 8px; border-radius:6px;}
  .proc-chip .dur{color:var(--faint);}
  .del-btn{flex-shrink:0; width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--faint); transition:color 0.15s, background 0.15s;}
  .del-btn:hover{color:#E2622E; background:#FBE8E0;}

  /* FAB */
  .fab{position:static; margin:6px auto 28px; width:78px; height:78px; border-radius:50%; background:#15815A; color:#FFFFFF; display:flex; align-items:center; justify-content:center; box-shadow:0 12px 32px rgba(21,129,90,0.45); transition:transform 0.1s; z-index:40;}
  .fab:active{transform:scale(0.95);}

  /* Modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; padding:0 24px; z-index:50;}
  .modal-box{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; max-width:380px; width:100%;}
  .modal-box p{font-size:14px; color:var(--text2); margin-bottom:16px;}
  .modal-actions{display:flex; gap:8px;}
  .modal-btn{flex:1; padding:10px; border-radius:8px; font-size:14px; font-weight:500;}
  .modal-btn.cancel{color:var(--text2); background:var(--chip);}
  .modal-btn.confirm{color:#fff; background:#E2622E;}

  /* Toast */
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:99px; font-size:14px; font-weight:500; box-shadow:0 12px 32px rgba(0,0,0,0.18); z-index:60; display:flex; align-items:center; gap:8px; max-width:90%; text-align:center; animation:toastIn 0.25s ease-out;}
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

  /* New case screen */
  .nc-header{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .back-btn{width:36px; height:36px; border-radius:8px; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text3); flex-shrink:0;}
  .nc-step{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.2em; color:var(--muted); text-transform:uppercase;}
  .nc-title{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700;}

  .shift-option{width:100%; text-align:left; padding:16px; border-radius:12px; border:1px solid var(--border); background:var(--panel); display:flex; align-items:center; gap:12px; margin-bottom:12px; transition:border-color 0.15s, background 0.15s;}
  .shift-option .dot{width:10px; height:10px;}
  .shift-option .shift-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .shift-option .shift-time{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); margin-top:2px;}

  .active-shift-tag{display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:13px; color:var(--muted2);}

  .proc-card{border-radius:12px; border:1px solid var(--border); background:var(--panel); margin-bottom:10px; transition:border-color 0.15s, background 0.15s;}
  .proc-card.selected{border-color:var(--accent); background:var(--accent-soft);}
  .proc-card-btn{width:100%; display:flex; align-items:center; gap:12px; padding:14px; text-align:left;}
  .checkbox{width:20px; height:20px; border-radius:6px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:border-color 0.15s, background 0.15s;}
  .checkbox.checked{border-color:var(--accent); background:var(--accent);}
  .proc-name{font-size:14px; font-weight:500; color:var(--text2);}
  .dur-row{padding:0 14px 14px; display:flex; flex-wrap:wrap; gap:6px;}
  .dur-chip{font-family:'IBM Plex Mono',monospace; font-size:12px; padding:6px 10px; border-radius:8px; background:var(--chip); color:var(--muted2); border:1px solid var(--border); transition:background 0.15s, color 0.15s;}
  .dur-chip.selected{background:var(--accent); color:#fff; border-color:var(--accent);}

  .save-bar{position:sticky; bottom:0; padding-top:16px; margin-top:16px; background:linear-gradient(to top, var(--bg) 60%, transparent);}
  .save-btn{width:100%; padding:14px; border-radius:12px; font-family:'Space Grotesk',sans-serif; font-weight:600; color:#fff; background:var(--accent); display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity 0.15s;}
  .save-btn:disabled{opacity:0.4;}

  @media (max-width: 520px){
    .wrap{max-width:none; width:100%; padding:18px 8px 14px;}
    .header{margin-bottom:20px; gap:10px; padding:0 2px;}
    .header .date{font-size:12px; letter-spacing:0.13em;}
    .header h1{font-size:26px; line-height:1.1;}
    .header .icon{width:50px; height:50px;}
    .ring-card{padding:16px 12px; margin-bottom:24px;}
    .ring-row{gap:12px;}
    .ring-box{width:188px; height:188px;}
    .ring-box > svg{width:188px; height:188px;}
    .ring-center .num{font-size:38px;}
    .ring-center .lbl{font-size:11px;}
    .ring-legend{gap:13px;}
    .ring-legend-row .label,
    .ring-legend-row .count{font-size:17px;}
    .ring-legend-row .now-tag{font-size:11px;}
    .section{margin-bottom:24px;}
    .section h2{font-size:15px;}
    .bar-top .name,
    .bar-top .count{font-size:17px;}
    .bar-track{height:9px;}
    .trend-chart{height:160px; gap:8px;}
    .trend-count{font-size:12px; height:14px;}
    .trend-label{font-size:13px;}
    .fab{width:88px; height:88px; margin:10px auto 24px;}
    .fab svg{width:42px; height:42px;}
    .shift-option{padding:18px 16px;}
    .shift-option .shift-name{font-size:17px;}
    .shift-option .shift-time{font-size:13px;}
    .proc-card-btn{padding:16px;}
    .proc-name{font-size:16px;}
    .dur-chip{font-size:13px; padding:8px 12px;}
    .save-btn{padding:16px; font-size:16px;}
  }

  @media (max-width: 380px){
    .ring-box{width:180px; height:180px;}
    .ring-box > svg{width:180px; height:180px;}
    .ring-legend-row .label,
    .ring-legend-row .count{font-size:16px;}
  }

  svg{display:block;}
</style>

<body>

  <div class="spinner"></div>
  <span>Memuatkan data dari Sheet...</span>
</div>

<div id="dashboard-view" class="wrap"></div>

<button id="fab" class="fab" aria-label="Tambah kes baru">
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>

<script>
// ====================== CONFIG ======================
// IMPORTANT: this must be the exact Web App "/exec" URL from Deploy > Manage
// deployments. We hardcode it rather than deriving from window.location.href,
// because Apps Script's served page can load through an intermediate
// googleusercontent.com proxy URL — using that proxy URL for POST/GET calls
// causes silent failures. Always the *exec* URL, not the dev/HEAD one.
const BASE_URL = window.AMO_CONFIG.apiUrl;
const DATA_URL = BASE_URL + "?action=data";

const SHIFTS = [
  { id: "morning", label: "Pagi", time: "07:00 - 14:00", color: "var(--pagi)", hex: "#F2A93B", glow: "var(--pagi-glow)" },
  { id: "evening", label: "Petang", time: "14:00 – 21:00", color: "var(--petang)", hex: "#E2622E", glow: "var(--petang-glow)" },
  { id: "night", label: "Malam", time: "21:00 - 07:00", color: "var(--malam)", hex: "#5B7FE0", glow: "var(--malam-glow)" },
];

const PROCEDURES = [
  "Dressing","T&S","Eye Irrigation","Ambulance Call","CBD",
  "Ryle's Tube","Blood Taking","Suture Removal (S.T.O)","Blood for TSB","Nail Avulsion",
];

const DURATIONS = [
  { id: "5m", label: "5 minit", minutes: 5 },
  { id: "10m", label: "10 minit", minutes: 10 },
  { id: "15m", label: "15 minit", minutes: 15 },
  { id: "20m", label: "20 minit", minutes: 20 },
  { id: "30m", label: "30 minit", minutes: 30 },
  { id: "1h", label: "1 jam", minutes: 60 },
];

const PROCEDURE_DEFAULT_DURATION = {
  "Vital Sign": "5m",
  "Remove Foreign Body": "5m",
};

function defaultDurationIdForProcedure(name){
  return PROCEDURE_DEFAULT_DURATION[name] || "15m";
}

function shiftMeta(id){ return SHIFTS.find(s => s.id === id); }
function calendarDateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function operationalDate(d = new Date()){
  const result = new Date(d);
  if(result.getHours() < 7) result.setDate(result.getDate() - 1);
  return result;
}
function todayKey(){
  return calendarDateKey(operationalDate());
}
function dateKeyForShift(d, shiftId){
  const result = new Date(d);
  if(shiftId === "night" && result.getHours() < 7) result.setDate(result.getDate() - 1);
  return calendarDateKey(result);
}
function dateKeyOffset(daysAgo){
  const d = operationalDate();
  d.setDate(d.getDate() - daysAgo);
  return calendarDateKey(d);
}
function visibleTrendDateKeys(){
  const keys = new Set();
  for(let i=0;i<7;i++) keys.add(dateKeyOffset(i));
  return keys;
}
function normalizeDateKey(value){
  if(!value) return "";
  if(value instanceof Date && !Number.isNaN(value.getTime())){
    return `${value.getFullYear()}-${String(value.getMonth()+1).padStart(2,"0")}-${String(value.getDate()).padStart(2,"0")}`;
  }
  const raw = String(value).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}T/.test(raw)){
    const parsedIso = new Date(raw);
    if(!Number.isNaN(parsedIso.getTime())){
      return `${parsedIso.getFullYear()}-${String(parsedIso.getMonth()+1).padStart(2,"0")}-${String(parsedIso.getDate()).padStart(2,"0")}`;
    }
  }
  const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(iso) return `${iso[1]}-${iso[2].padStart(2,"0")}-${iso[3].padStart(2,"0")}`;
  const slash = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(slash){
    const a = Number(slash[1]);
    const b = Number(slash[2]);
    const year = slash[3];
    const day = a > 12 ? a : b;
    const month = a > 12 ? b : a;
    return `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  }
  const parsed = new Date(raw);
  if(!Number.isNaN(parsed.getTime())){
    return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,"0")}-${String(parsed.getDate()).padStart(2,"0")}`;
  }
  return raw;
}
function esc(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function fetchRowsWithRetry(maxAttempts = 3){
  let lastError;
  for(let attempt = 1; attempt <= maxAttempts; attempt++){
    try{
      const res = await fetch(`${DATA_URL}&_=${Date.now()}&attempt=${attempt}`, { method: "GET", cache: "no-store" });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }catch(err){
      lastError = err;
      if(attempt < maxAttempts) await sleep(700 * attempt);
    }
  }
  throw lastError;
}
// ====================== STATE ======================
let state = {
  cases: [],
  dashboardDate: todayKey(),
  dashboardTab: "summary", // summary | records | report
  recordShiftFilter: "all", // all | morning | evening | night
  reportPeriod: "weekly", // weekly | monthly | yearly
  reportMonth: new Date().getMonth() + 1,
  reportWeek: 1,
  reportYear: new Date().getFullYear(),
  reportShift: "all",
  reportCases: null,
  reportLoading: false,
  reportError: "",
  view: "dashboard", // dashboard | newcase
  step: 1,
  selectedShift: null,
  selectedProcs: {}, // { name: durationId }
  syncError: false,
  saving: false,
};

// ====================== DATA LAYER ======================
async function loadCases(){
  state.dashboardDate = todayKey();
  document.getElementById("loading-screen").classList.remove("hidden");
  document.getElementById("dashboard-view").classList.add("hidden");
  document.getElementById("fab").classList.add("hidden");
  try{
    const rows = await fetchRowsWithRetry();
    const dataRows = rows.slice(1); // skip header
    const grouped = {};
    const trendDateKeys = visibleTrendDateKeys();
    dataRows.forEach((row, idx) => {
      const [ts, date, time, shift, procedure, minutes] = row;
      const dateKey = normalizeDateKey(date);
      if(!trendDateKeys.has(dateKey)) return;
      const key = `${ts}|${dateKey}|${time}|${shift}`;
      if(!grouped[key]){
        grouped[key] = { id: `remote_${idx}_${ts}`, date: dateKey, time, shift, procedures: [] };
      }
      const durMin = Number(minutes);
      const durMatch = DURATIONS.find(d => d.minutes === durMin);
      grouped[key].procedures.push({
        name: procedure,
        minutes: durMin,
        durationLabel: durMatch ? durMatch.label : `${durMin} min`,
      });
    });
    state.cases = Object.values(grouped);
    state.syncError = false;
  }catch(e){
    console.error("Load failed:", e);
    state.syncError = true;
  }
  document.getElementById("loading-screen").classList.add("hidden");
  document.getElementById("fab").classList.remove("hidden");
  renderView();
}

async function saveCase(newCase){
  state.saving = true;
  state.cases.push(newCase);
  state.view = "dashboard";
  state.step = 1;
  state.selectedShift = null;
  state.selectedProcs = {};
  state.saving = false;
  renderView();
  showToast("Kes direkod. Sync ke Firebase...");
  writeCasesCache(state.cases);

  if(!window.AMO_CONFIG.writeEnabled){
    showToast("Mod ujian: tiada data dihantar ke Firebase");
    return;
  }

  try{
    const res = await fetch(BASE_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(newCase),
    });
    const resultText = await res.text();
    console.log("POST status:", res.status, "body:", resultText);
    let parsed;
    try{ parsed = JSON.parse(resultText); }catch(_){ parsed = null; }
    if(!res.ok || !parsed || parsed.result !== "success"){
      throw new Error("Server did not confirm success: " + resultText.slice(0,200));
    }
    state.syncError = false;
    showToast("Sync ke Firebase selesai");
  }catch(e){
    console.error("Save failed:", e);
    state.syncError = true;
    showToast("Data dipapar, tapi sync Firebase gagal");
    renderView();
  }
}

function renderDashboard(){
  const today = state.dashboardDate;
  const now = new Date();
  const todayCases = state.cases.filter(c => c.date === today);

  // Stats
  const procCount = {};
  const shiftCount = { morning: 0, evening: 0, night: 0 };
  let totalProcedures = 0;
  todayCases.forEach(c => {
    shiftCount[c.shift] = (shiftCount[c.shift] || 0) + c.procedures.length;
    c.procedures.forEach(p => {
      procCount[p.name] = (procCount[p.name] || 0) + 1;
      totalProcedures++;
    });
  });
  const topProcedures = Object.entries(procCount).sort((a,b) => b[1]-a[1]).slice(0,5);
  const maxProcCount = topProcedures.length ? topProcedures[0][1] : 1;

  // 7-day trend
  const days = [];
  for(let i=6;i>=0;i--){
    const d = operationalDate();
    d.setDate(d.getDate()-i);
    const key = calendarDateKey(d);
    const count = state.cases.filter(c => c.date === key).reduce((sum,c) => sum + c.procedures.length, 0);
    days.push({ label: d.toLocaleDateString("ms-MY",{weekday:"short"}).slice(0,3), count, isToday: key === today });
  }
  const maxDay = Math.max(...days.map(d=>d.count), 1);

  const h = now.getHours();
  const currentShiftId = (h>=7 && h<14) ? "morning" : (h>=14 && h<21) ? "evening" : "night";

  // Ring geometry
  const total = Math.max(shiftCount.morning + shiftCount.evening + shiftCount.night, 1);
  const R = 72, CIRC = 2*Math.PI*R, gapLen = (6/360)*CIRC;
  let cursor = 0;
  const arcs = SHIFTS.map(s => {
    const val = shiftCount[s.id] || 0;
    const rawLen = (val/total) * (CIRC - gapLen*3);
    const len = val > 0 ? Math.max(rawLen, 10) : 0;
    const start = cursor;
    cursor += len + gapLen;
    return { ...s, val, len, start };
  });

  const html = `
    <div class="header">
      <div>
        <div class="date">ETD &middot; ${esc(now.toLocaleDateString("ms-MY",{day:"numeric",month:"long",year:"numeric"}))}</div>
        <h1>Assistant Medical Officer (A.M.O) Procedure Log</h1>
      </div>
      <div class="icon">
        <img src="./prosedur-icon.png?v=2.6.0" alt="Logo Log Prosedur A.M.O">
      </div>
    </div>

    ${state.syncError ? `
      <button class="sync-warn" onclick="loadCases()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M2 12c0-1 .4-2 1-3l1.4-1.4"></path><path d="M22 12c0 1-.4 2-1 3l-1.4 1.4"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
        <span>Tak dapat sync dengan Firebase. Data baru disimpan dalam app sahaja. Tekan untuk cuba lagi.</span>
      </button>
    ` : ""}

    <div class="ring-card">
      <div class="ring-row">
        <div class="ring-box">
          <svg width="168" height="168" viewBox="0 0 168 168" style="transform:rotate(-90deg)">
            <circle cx="84" cy="84" r="${R}" fill="none" stroke="#F1EEE5" stroke-width="14"/>
            ${arcs.map(arc => `
              <circle cx="84" cy="84" r="${R}" fill="none" stroke="${arc.hex}" stroke-width="14" stroke-linecap="round"
                stroke-dasharray="${arc.len} ${CIRC-arc.len}" stroke-dashoffset="${-arc.start}"
                opacity="${arc.id===currentShiftId ? 1 : 0.55}" style="transition:stroke-dasharray 0.7s ease-out"/>
            `).join("")}
          </svg>
          <div class="ring-center">
            <span class="num">${todayPatientCount}</span>
            <span class="lbl">pesakit hari ini</span>
          </div>
        </div>
        <div class="ring-legend">
          ${SHIFTS.map(s => `
            <div class="ring-legend-row">
              <div class="ring-legend-left">
                <span class="dot" style="background:${s.hex}; ${s.id===currentShiftId ? `box-shadow:0 0 0 3px ${s.glow}` : ""}"></span>
                <span class="label">${s.label}</span>
                ${s.id===currentShiftId ? `<span class="now-tag">sekarang</span>` : ""}
              </div>
              <span class="count">${shiftCount[s.id] || 0}</span>
            </div>
          `).join("")}
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Prosedur paling kerap</h2>
      ${topProcedures.length === 0 ? `<div class="empty-note">Belum ada prosedur direkod hari ini.</div>` : `
        ${topProcedures.map(([name,count],i) => `
          <div class="bar-row">
            <div class="bar-top"><span class="name">${esc(name)}</span><span class="count">${count}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.max((count/maxProcCount)*100,5)}%; background:${i===0 ? "linear-gradient(90deg,#6FE3A8,#4FC890)" : "#E4E0D5"}"></div></div>
          </div>
        `).join("")}
      `}
    </div>

    <div class="section">
      <h2>Trend 7 hari</h2>
      <div class="trend-chart">
        ${days.map(d => `
          <div class="trend-col">
            <span class="trend-count">${d.count || ""}</span>
            <div class="trend-bar" style="height:${Math.max((d.count/maxDay)*100, d.count>0?6:2)}%; background:${d.isToday ? "linear-gradient(180deg,#6FE3A8,#2F8F66)" : "#E4E0D5"}"></div>
            <span class="trend-label ${d.isToday ? "today" : ""}">${esc(d.label)}</span>
          </div>
        `).join("")}
      </div>
    </div>

  `;

  document.getElementById("dashboard-view").innerHTML = html;
}

function patientKeyV2(caseItem){
  const id = String(caseItem.registrationNumber || caseItem.patientId || caseItem.id || "").trim().toUpperCase();

  return id ? `${id}|${shift}` : "";

function uniquePatientCountV2(cases){

function normalizeProcedureNameV2(value){

}

function casesFromSheetRows(rows, limitToTrend = true){
  const headers = (rows[0] || []).map(h => String(h || "").trim());
  const findIndex = (name, fallback) => {
    const idx = headers.indexOf(name);
    return idx >= 0 ? idx : fallback;
  };
  const hasZoneColumns = headers.includes("Zone") || headers.includes("IDPesakit") || headers.includes("ID Pesakit") || headers.includes("RegistrationNumber");
  const col = {
    ts: findIndex("Timestamp", 0),
    date: findIndex("Date", 1),
    time: findIndex("Time", 2),
    shift: findIndex("Shift", 3),
    zone: findIndex("Zone", hasZoneColumns ? 4 : -1),
    reg: findIndex("IDPesakit", findIndex("ID Pesakit", findIndex("RegistrationNumber", hasZoneColumns ? 5 : -1))),
    procedure: findIndex("Procedure", hasZoneColumns ? 6 : 4),
    minutes: findIndex("DurationMinutes", hasZoneColumns ? 7 : 5),
    orderedBy: findIndex("OrderedBy", 8),
  };
  const grouped = {};
  const trendDateKeys = visibleTrendDateKeys();
  rows.slice(1).forEach((row, idx) => {
    const ts = row[col.ts];
    const dateKey = normalizeDateKey(row[col.date]);
    if(limitToTrend && !trendDateKeys.has(dateKey)) return;
    const time = row[col.time];
    const shift = row[col.shift];
    const zone = col.zone >= 0 ? String(row[col.zone] || "").trim() : "";
    const registrationNumber = col.reg >= 0 ? String(row[col.reg] || "").trim() : "";
    const key = `${ts}|${dateKey}|${time}|${shift}|${zone}|${registrationNumber}`;
    if(!grouped[key]) grouped[key] = { id: `remote_${idx}_${ts}`, date: dateKey, time, shift, zone, registrationNumber, procedures: [] };
    const durMin = Number(row[col.minutes]);
    const durMatch = DURATIONS.find(d => d.minutes === durMin);
    grouped[key].procedures.push({ name: normalizeProcedureNameV2(row[col.procedure]), minutes: durMin, durationLabel: durMatch ? durMatch.label : `${durMin} min`, orderedBy: col.orderedBy >= 0 ? String(row[col.orderedBy] || "").trim() : "" });
  });
  return Object.values(grouped);
}

function updateReportFilter(name, value){
  if(name === "period") state.reportPeriod = ["weekly","monthly","yearly"].includes(value) ? value : "weekly";
  if(name === "month") state.reportMonth = Math.min(12, Math.max(1, Number(value) || 1));
  if(name === "week") state.reportWeek = Math.min(5, Math.max(1, Number(value) || 1));
  if(name === "year") state.reportYear = Math.min(2100, Math.max(2020, Number(value) || new Date().getFullYear()));
  if(name === "shift") state.reportShift = ["morning","evening","night"].includes(value) ? value : "all";
  state.reportCases = null;
  state.reportError = "";
  renderDashboard();
}

function reportDateRange(){
  const year = state.reportYear;
  if(state.reportPeriod === "yearly"){
    return { start: new Date(year,0,1), end: new Date(year,11,31), label: `Tahun ${year}` };
  }
  const monthIndex = state.reportMonth - 1;
  const monthName = REPORT_MONTHS[monthIndex];
  if(state.reportPeriod === "monthly"){
    return { start: new Date(year,monthIndex,1), end: new Date(year,monthIndex + 1,0), label: `${monthName} ${year}` };
  }
  const startDay = ((state.reportWeek - 1) * 7) + 1;
  const lastDay = new Date(year,monthIndex + 1,0).getDate();
  const endDay = state.reportWeek === 5 ? lastDay : Math.min(startDay + 6, lastDay);
  const safeStartDay = Math.min(startDay, lastDay);
  return {
    start: new Date(year,monthIndex,safeStartDay),
    end: new Date(year,monthIndex,endDay),
    label: `Minggu ${state.reportWeek}, ${monthName} ${year} (${safeStartDay}–${endDay} ${monthName})`,
  };
}

function dateFromKey(key){
  const match = String(key || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match ? new Date(Number(match[1]),Number(match[2]) - 1,Number(match[3])) : null;
}

function filterReportCases(cases){
  const range = reportDateRange();
  const start = calendarDateKey(range.start);
  const end = calendarDateKey(range.end);
  return cases.filter(item => item.date >= start && item.date <= end && (state.reportShift === "all" || item.shift === state.reportShift));
}

async function generateProcedureReport(){
  state.reportLoading = true;
  state.reportError = "";
  renderDashboard();
  try{
    const rows = await fetchRowsWithRetry();
    state.reportCases = filterReportCases(casesFromSheetRows(rows, false));
  }catch(err){
    console.error("Report load failed:", err);
    state.reportCases = null;
    state.reportError = "Data penuh tidak dapat dimuatkan. Semak sambungan dan cuba lagi.";
  }
  state.reportLoading = false;
  renderDashboard();
}

function formatReportDate(key){
  const date = dateFromKey(key);
  return date ? date.toLocaleDateString("ms-MY", { day:"2-digit", month:"2-digit", year:"numeric" }) : key;
}

function reportPreviewHtml(cases){
  const range = reportDateRange();
  const shiftLabel = state.reportShift === "all" ? "Semua syif" : `Syif ${shiftMeta(state.reportShift)?.label || state.reportShift}`;
  const procedureTotal = cases.reduce((sum,item) => sum + item.procedures.length, 0);
  const aggregates = new Map();
  cases.forEach(item => item.procedures.forEach(proc => {
    const name = proc.name || "Tidak dinyatakan";
    if(!aggregates.has(name)) aggregates.set(name,{name,count:0,patients:new Set()});
    const entry = aggregates.get(name);
    entry.count += 1;
    const patientKey = patientKeyV2(item);
    if(patientKey) entry.patients.add(patientKey);
  }));
  const rows = [...aggregates.values()]
    .sort((a,b) => b.count-a.count || a.name.localeCompare(b.name,"ms-MY"))
    .map(entry => `<tr><td>${esc(entry.name)}</td><td class="report-number">${entry.count}</td><td class="report-number">${entry.patients.size}</td><td class="report-number">${procedureTotal ? (entry.count/procedureTotal*100).toFixed(1) : "0.0"}%</td></tr>`).join("");
  return `<section class="report-preview" id="procedure-report-print">
    <header class="report-print-header"><div><p>UNIT KECEMASAN & TRAUMA · HOSPITAL KUALA LIPIS</p><h2>Laporan Ringkasan Prosedur A.M.O</h2><span>${esc(range.label)} · ${esc(shiftLabel)}</span></div><img src="./prosedur-icon.png?v=2.6.0" alt=""></header>
    <div class="report-summary"><div><strong>${uniquePatientCountV2(cases)}</strong><span>Jumlah pesakit</span></div><div><strong>${procedureTotal}</strong><span>Jumlah prosedur</span></div><div><strong>${aggregates.size}</strong><span>Jenis prosedur</span></div></div>
    ${rows ? `<div class="report-table-wrap"><table class="report-table"><thead><tr><th>Prosedur</th><th>Jumlah prosedur</th><th>Jumlah pesakit</th><th>Peratus</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="report-empty">Tiada rekod untuk tempoh dan syif yang dipilih.</div>`}
    <footer class="report-print-footer">Tiada identiti pesakit dipaparkan · Dijana pada ${esc(new Date().toLocaleString("ms-MY"))}</footer>
  </section>`;
}

function dailyRecordsHtml(todayCases, now){
  const operationDate = operationalDate(now);
  const dateLabel = operationDate.toLocaleDateString("ms-MY", { day:"numeric", month:"long", year:"numeric" });
  const visibleShifts = state.recordShiftFilter === "all" ? SHIFTS : SHIFTS.filter(shift => shift.id === state.recordShiftFilter);
  const shiftSections = visibleShifts.map(shift => {
    const cases = todayCases
      .filter(item => item.shift === shift.id)
      .slice()
      .sort((a,b) => String(a.time || "").localeCompare(String(b.time || "")));
    const procedureTotal = cases.reduce((sum,item) => sum + item.procedures.length, 0);
    const patientTotal = uniquePatientCountV2(cases);
    const cards = cases.length ? cases.map(item => {
      const zone = zoneMeta(item.zone);
      const patientId = item.registrationNumber || item.patientId || "Tiada ID";
      return `<article class="daily-record-card">
        <div class="daily-record-head">
          <span class="daily-record-time">${esc(String(item.time || "—"))}</span>
          <span class="daily-record-id">${esc(String(patientId))}</span>
          <span class="daily-record-zone">${esc(zone ? zone.label : "Tiada Zone")}</span>
        </div>
        <div class="daily-record-procedures">${item.procedures.map(proc => `<span class="daily-procedure-chip">${esc(proc.name)} <small>${esc(proc.durationLabel || (proc.minutes + " min"))}${proc.orderedBy ? `<br>Arahan daripada ${esc(proc.orderedBy)}` : ""}</small></span>`).join("")}</div>
      </article>`;
    }).join("") : `<div class="daily-shift-empty">Belum ada rekod untuk shift ${shift.label}.</div>`;
    return `<section class="daily-shift-section">
      <div class="daily-shift-heading">
        <div><span class="dot" style="background:${shift.hex}"></span><strong>${shift.label}</strong><small>${shift.time}</small></div>
        <span>${patientTotal} pesakit · ${procedureTotal} prosedur</span>
      </div>
      <div class="daily-record-list">${cards}</div>
    </section>`;
  }).join("");
  return `<div class="header"><div><div class="date">HARI OPERASI · ${esc(dateLabel)}</div><h1>Rekod Prosedur Hari Ini</h1></div><div class="icon"><img src="./prosedur-icon.png?v=2.6.0" alt="Logo Log Prosedur A.M.O"></div></div>
    ${dashboardTabsHtml("records")}

    <div class="daily-operation-note">Paparan ini meliputi 7:00 pagi hingga 7:00 pagi hari berikutnya dan bertukar secara automatik pada 7:00 pagi.</div>
    ${shiftSections}`;
}

    state.cases = casesFromSheetRows(rows);
    writeCasesCache(state.cases);
    state.syncError = false;
  }catch(e){

    state.syncError = true;
  }
  document.getElementById("loading-screen").classList.add("hidden");

};

renderDashboard = function(){
  const today = state.dashboardDate;
  const now = new Date();
  const todayCases = state.cases.filter(c => c.date === today);
  document.getElementById("fab").classList.toggle("hidden", state.dashboardTab === "report");
  if(state.dashboardTab === "report"){
    document.getElementById("dashboard-view").innerHTML = procedureReportHtml();
    return;
  }
  if(state.dashboardTab === "records"){
    document.getElementById("dashboard-view").innerHTML = dailyRecordsHtml(todayCases, now);
    return;
  }
  const todayPatientCount = uniquePatientCountV2(todayCases);
  const procCount = {};
  const shiftCount = { morning: 0, evening: 0, night: 0 };
  const zoneStats = Object.fromEntries(ZONES_V2.map(z => [z.id, { ...z, patients: 0, procedures: 0 }]));
  todayCases.forEach(c => {
    shiftCount[c.shift] = (shiftCount[c.shift] || 0) + c.procedures.length;
    const zoneKey = c.zone || "unassigned";
    if(!zoneStats[zoneKey]) zoneStats[zoneKey] = { id: zoneKey, label: "Tiada Zone", hex: "#8A8478", patients: 0, procedures: 0 };
    zoneStats[zoneKey].patients += 1;
    zoneStats[zoneKey].procedures += c.procedures.length;
    c.procedures.forEach(p => { procCount[p.name] = (procCount[p.name] || 0) + 1; });
  });
  const topProcedures = Object.entries(procCount).sort((a,b) => b[1]-a[1]).slice(0,5);
  const maxProcCount = topProcedures.length ? topProcedures[0][1] : 1;
  const zoneRows = Object.values(zoneStats);
  const maxZoneProcedures = Math.max(...zoneRows.map(z => z.procedures), 1);
  const days = [];
  for(let i=6;i>=0;i--){
    const d = operationalDate();
    d.setDate(d.getDate()-i);
    const key = calendarDateKey(d);
    const count = state.cases.filter(c => c.date === key).reduce((sum,c) => sum + c.procedures.length, 0);
    days.push({ label: d.toLocaleDateString("ms-MY",{weekday:"short"}).slice(0,3), count, isToday: key === today });
  }
  const maxDay = Math.max(...days.map(d=>d.count), 1);
  const minutesNow = now.getHours() * 60 + now.getMinutes();
  const currentShiftId = (minutesNow>=420 && minutesNow<840) ? "morning" : (minutesNow>=840 && minutesNow<1260) ? "evening" : "night";
  const total = Math.max(shiftCount.morning + shiftCount.evening + shiftCount.night, 1);
  const R = 72, CIRC = 2*Math.PI*R, gapLen = (6/360)*CIRC;
  let cursor = 0;
  const arcs = SHIFTS.map(s => {
    const val = shiftCount[s.id] || 0;
    const rawLen = (val/total) * (CIRC - gapLen*3);
    const len = val > 0 ? Math.max(rawLen, 10) : 0;
    const start = cursor;
    cursor += len + gapLen;
    return { ...s, val, len, start };
  });
  const html = `
    <div class="header"><div><div class="date">ETD &middot; ${esc(now.toLocaleDateString("ms-MY",{day:"numeric",month:"long",year:"numeric"}))}</div><h1>Assistant Medical Officer (A.M.O) Procedure Log</h1></div><div class="icon"><img src="./prosedur-icon.png?v=2.6.0" alt="Logo Log Prosedur A.M.O"></div></div>
    ${dashboardTabsHtml("summary")}
    ${state.syncError ? `<button class="sync-warn" onclick="loadCases()"><span>Tak dapat sync dengan Firebase. Data baru disimpan dalam app sahaja. Tekan untuk cuba lagi.</span></button>` : ""}
    <div class="ring-card"><div class="ring-row"><div class="ring-box"><svg width="168" height="168" viewBox="0 0 168 168" style="transform:rotate(-90deg)"><circle cx="84" cy="84" r="${R}" fill="none" stroke="#F1EEE5" stroke-width="14"/>${arcs.map(arc => `<circle cx="84" cy="84" r="${R}" fill="none" stroke="${arc.hex}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${arc.len} ${CIRC-arc.len}" stroke-dashoffset="${-arc.start}" opacity="${arc.id===currentShiftId ? 1 : 0.55}"/>`).join("")}</svg><div class="ring-center"><span class="num">${todayPatientCount}</span><span class="lbl">pesakit hari ini</span></div></div><div class="ring-legend">${SHIFTS.map(s => `<div class="ring-legend-row"><div class="ring-legend-left"><span class="dot" style="background:${s.hex}; ${s.id===currentShiftId ? `box-shadow:0 0 0 3px ${s.glow}` : ""}"></span><span class="label">${s.label}</span>${s.id===currentShiftId ? `<span class="now-tag">sekarang</span>` : ""}</div><span class="count">${shiftCount[s.id] || 0}</span></div>`).join("")}</div></div></div>
    <div class="section"><h2>Prosedur paling kerap</h2>${topProcedures.length === 0 ? `<div class="empty-note">Belum ada prosedur direkod hari ini.</div>` : topProcedures.map(([name,count],i) => `<div class="bar-row"><div class="bar-top"><span class="name">${esc(name)}</span><span class="count">${count}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max((count/maxProcCount)*100,5)}%; background:${i===0 ? "linear-gradient(90deg,#6FE3A8,#4FC890)" : "#E4E0D5"}"></div></div></div>`).join("")}</div>
    <div class="section"><h2>Trend 7 hari</h2><div class="trend-chart">${days.map(d => `<div class="trend-col"><span class="trend-count">${d.count || ""}</span><div class="trend-bar" style="height:${Math.max((d.count/maxDay)*100, d.count>0?6:2)}%; background:${d.isToday ? "linear-gradient(180deg,#6FE3A8,#2F8F66)" : "#E4E0D5"}"></div><span class="trend-label ${d.isToday ? "today" : ""}">${esc(d.label)}</span></div>`).join("")}</div></div>
  `;
  document.getElementById("dashboard-view").innerHTML = html;
};

renderNewCase = function(){
  const view = document.getElementById("newcase-view");
  if(state.step === 1){
    view.innerHTML = `<div class="nc-header"><button class="back-btn" onclick="goBackToDashboard()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button><div><div class="nc-step">Kes baru &middot; Langkah 1/3</div><div class="nc-title">Pilih shift</div></div></div><div>${SHIFTS.map(s => `<button class="shift-option" onclick="selectShift('${s.id}')"><span class="dot" style="background:${s.hex}"></span><div><div class="shift-name">${s.label}</div><div class="shift-time">${s.time}</div></div></button>`).join("")}</div>`;
    return;
  }
  if(state.step === 2){
    const activeShift = shiftMeta(state.selectedShift);
    view.innerHTML = `<div class="nc-header"><button class="back-btn" onclick="state.step=1; renderView();"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button><div><div class="nc-step">Kes baru &middot; Langkah 2/3</div><div class="nc-title">Pilih Zone</div></div></div><div class="active-shift-tag"><span class="dot" style="background:${activeShift.hex}; width:8px; height:8px;"></span><span>Shift ${activeShift.label} &middot; ${activeShift.time}</span></div><div class="field-label">Pilih Zone dahulu</div><div>${ZONES_V2.map(z => `<button class="zone-option" onclick="selectZone('${z.id}')"><span class="dot" style="background:${z.hex}; width:10px; height:10px;"></span><div class="zone-name">${z.label}</div></button>`).join("")}</div>`;
    return;
  }
  const activeShift = shiftMeta(state.selectedShift);
  const activeZone = zoneMeta(state.selectedZone);
  const selectedCount = Object.keys(state.selectedProcs).length;
  const procedures = visibleProceduresV2();
  const patientId = state.registrationNumber.trim();
  const patientReady = patientId.length > 0;
  view.innerHTML = `<div class="nc-header"><button class="back-btn" onclick="state.step=2; renderView();"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button><div><div class="nc-step">Kes baru &middot; Langkah 3/3</div><div class="nc-title">Masukkan ID Pesakit</div></div></div><div class="active-shift-tag"><span class="dot" style="background:${activeShift.hex}; width:8px; height:8px;"></span><span>Shift ${activeShift.label} &middot; ${activeShift.time}</span></div><div class="active-shift-tag"><span class="dot" style="background:${activeZone.hex}; width:8px; height:8px;"></span><span>${activeZone.label}</span></div><div class="field-group"><div class="field-label">ID Pesakit</div><div class="empty-note" style="margin-bottom:10px; text-align:left; padding:12px 14px;">Masukkan ID Pesakit dahulu.</div><input class="text-input" value="${esc(state.registrationNumber)}" placeholder="Masukkan ID Pesakit, contoh: ID001" oninput="setRegistrationNumber(this.value)" autofocus></div>${patientReady ? "" : `<div id="patient-id-warning" class="sync-warn" style="margin-bottom:16px;"><span>Sila isi ID Pesakit dahulu sebelum pilih prosedur.</span></div>`}<div>${procedures.map(proc => { const name = proc.name; const isSelected = !!state.selectedProcs[name]; const safeId = name.replace(/[^a-zA-Z0-9]/g,"_"); const durId = selectedDurationId(name); const customMinutes = selectedCustomMinutes(name); const safeName = name.replace(/'/g,"\\'"); return `<div class="proc-card ${isSelected ? "selected" : ""}" id="card_${safeId}" style="${patientReady ? "" : "opacity:.45;"}"><button class="proc-card-btn" ${patientReady ? "" : "disabled"} onclick="toggleProcedure('${safeName}')"><span class="checkbox ${isSelected ? "checked" : ""}">${isSelected ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>` : ""}</span><span class="proc-name">${esc(name)}</span></button>${isSelected ? `<div class="dur-row">${DURATIONS.map(d => `<button class="dur-chip ${durId===d.id ? "selected" : ""}" onclick="setDuration('${safeName}','${d.id}')">${d.label}</button>`).join("")}</div><div class="field-group" style="margin-top:10px;"><div class="field-label">Custom tempoh prosedur</div><input class="text-input" type="number" min="1" inputmode="numeric" value="${esc(customMinutes)}" placeholder="Isi minit custom" oninput="setCustomDuration('${safeName}', this.value)"><div class="field-help">Isi jika tempoh selain pilihan masa tersedia.</div></div>` : ""}</div>`; }).join("")}</div><div class="save-bar"><button class="save-btn" id="save-btn" ${!patientReady || selectedCount===0 || state.saving ? "disabled" : ""} onclick="handleSaveCase()">Simpan kes ${selectedCount>0 ? `(${selectedCount} prosedur)` : ""}</button></div>`;
  const doctorList = document.createElement("datalist");
  doctorList.id = "doctor-suggestions";
  doctorList.innerHTML = doctorSuggestions().map(name => `<option value="${esc(name)}"></option>`).join("");
  view.appendChild(doctorList);
  Object.keys(state.selectedProcs).forEach(name => {
    const safeId = name.replace(/[^a-zA-Z0-9]/g,"_");
    const card = document.getElementById(`card_${safeId}`);
    if(!card) return;
    const field = document.createElement("div");
    field.className = "field-group doctor-field";
    field.innerHTML = `<div class="field-label">Arahan daripada</div><input class="text-input" list="doctor-suggestions" value="${esc(durationState(name).orderedBy || "")}" placeholder="Contoh: Dr Amira"><div class="field-help">Nama baharu akan diingati sebagai cadangan.</div>`;
    field.querySelector("input").addEventListener("input", event => setProcedureDoctor(name,event.target.value));
    card.appendChild(field);
  });
};

function durationState(name){
  const value = state.selectedProcs[name];
  if(value && typeof value === "object") return value;
  return { durationId: value || defaultDurationIdForProcedure(name), customMinutes: "", orderedBy: "" };
}

function selectedDurationId(name){
  return durationState(name).durationId || defaultDurationIdForProcedure(name);
}

function selectedCustomMinutes(name){
  return String(durationState(name).customMinutes || "");
}

function setCustomDuration(name, value){
  const allowed = new Set(visibleProceduresV2().map(proc => proc.name));
  if(!state.registrationNumber.trim()) { showToast("Sila isi ID Pesakit dahulu"); return; }
  if(!allowed.has(name)) return;
  state.selectedProcs[name] = { ...durationState(name), durationId: "custom", customMinutes: String(value || "") };
}

function setProcedureDoctor(name,value){
  if(!state.selectedProcs[name]) return;
  state.selectedProcs[name] = { ...durationState(name), orderedBy:String(value || "") };
}

selectShift = function(id){
  state.selectedShift = id;
  state.selectedZone = null;
  state.selectedProcs = {};
  state.step = 2;
  renderView();
};

function setRegistrationNumber(value){
  state.registrationNumber = value || "";
  const ready = state.registrationNumber.trim().length > 0;
  document.querySelectorAll(".proc-card-btn").forEach(btn => { btn.disabled = !ready; });
  document.querySelectorAll(".proc-card").forEach(card => { card.style.opacity = ready ? "" : ".45"; });
  const warning = document.getElementById("patient-id-warning");
  if(warning) warning.classList.toggle("hidden", ready);
  const saveBtn = document.getElementById("save-btn");
  if(saveBtn) saveBtn.disabled = !ready || Object.keys(state.selectedProcs).length === 0 || state.saving;
}

function selectZone(id){
  state.selectedZone = id;
  state.registrationNumber = "";
  const allowed = new Set(visibleProceduresV2().map(proc => proc.name));
  Object.keys(state.selectedProcs).forEach(name => { if(!allowed.has(name)) delete state.selectedProcs[name]; });
  state.step = 3;
  renderView();
}

toggleProcedure = function(name){
  const allowed = new Set(visibleProceduresV2().map(proc => proc.name));
  if(!state.registrationNumber.trim()) { showToast("Sila isi ID Pesakit dahulu"); return; }
  if(!allowed.has(name)) return;
  if(state.selectedProcs[name]) delete state.selectedProcs[name];
  else state.selectedProcs[name] = { durationId: defaultDurationIdForProcedure(name), customMinutes: "", orderedBy: "" };
  renderView();
};

setDuration = function(name, durId){
  const allowed = new Set(visibleProceduresV2().map(proc => proc.name));
  if(!state.registrationNumber.trim()) { showToast("Sila isi ID Pesakit dahulu"); return; }
  if(!allowed.has(name)) return;
  state.selectedProcs[name] = { ...durationState(name), durationId: durId, customMinutes: "" };
  renderView();
};

goBackToDashboard = function(){
  state.view = "dashboard";
  state.step = 1;
  state.selectedShift = null;
  state.selectedZone = null;
  state.registrationNumber = "";
  state.selectedProcs = {};
  renderView();
};

handleSaveCase = function(){
  const now = new Date();
  let procedures;
  try{
    procedures = Object.entries(state.selectedProcs).map(([name,value]) => {
      const selected = durationState(name);
      if(selected.durationId === "custom"){
        const minutes = Number(selected.customMinutes);
        if(!Number.isInteger(minutes) || minutes <= 0) throw new Error("Sila isi custom tempoh yang sah untuk " + name);
        return { name, durationId: "custom", durationLabel: minutes + " min", minutes, orderedBy:String(selected.orderedBy || "").trim() };
      }
      const dur = DURATIONS.find(d => d.id === selected.durationId) || DURATIONS[0];
      return { name, durationId: dur.id, durationLabel: dur.label, minutes: dur.minutes, orderedBy:String(selected.orderedBy || "").trim() };
    });
  }catch(err){
    showToast(err.message || "Custom tempoh tidak sah");
    return;
  }
  rememberDoctors(procedures);
  const newCase = {
    id: `case_${now.getTime()}_${Math.random().toString(36).slice(2,7)}`,
    date: dateKeyForShift(now, state.selectedShift),
    time: now.toLocaleTimeString("ms-MY",{hour:"2-digit",minute:"2-digit"}),
    shift: state.selectedShift,
    zone: state.selectedZone,
    registrationNumber: state.registrationNumber.trim(),
    patientId: state.registrationNumber.trim(),
    procedures,
  };
  saveCase(newCase);
};


// ====================== INIT ======================
state.cases = readCasesCache();
state.dashboardDate = todayKey();
document.getElementById("loading-screen").classList.add("hidden");
document.getElementById("dashboard-view").classList.remove("hidden");
document.getElementById("fab").classList.remove("hidden");
renderView();
window.setTimeout(() => loadCases(), 0);
let stopProcedureLive = null;
if(window.AMOSubscribe){
  stopProcedureLive = window.AMOSubscribe("procedure", records => {
    const trend = visibleTrendDateKeys();
    state.cases = records.filter(record => trend.has(normalizeDateKey(record.date))).map(record => ({
      ...record,
      date:normalizeDateKey(record.date),
      registrationNumber:record.registrationNumber || record.patientId || "",
      procedures:(record.procedures || []).map(proc => ({...proc,name:normalizeProcedureNameV2(proc.name),minutes:Number(proc.minutes)||0,durationLabel:proc.durationLabel || `${Number(proc.minutes)||0} min`,orderedBy:proc.orderedBy || ""}))
    }));
    writeCasesCache(state.cases); state.syncError = false;
    if(state.view === "dashboard" && !state.reportLoading) renderDashboard();
  }, error => { console.error("Firebase live procedure failed:",error); state.syncError = true; renderView(); });
}
window.addEventListener("beforeunload",()=>stopProcedureLive?.());
</script>
</body>
</html>
